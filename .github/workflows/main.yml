name: Terraform Progress

on:
    push:
        branches: [main]
    
jobs:

    update-progress:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: checkout
              uses: actions/checkout@v4
            
            - name: setup nodejs
              uses: actions/setup-node@v4
              with:
                node-version: "20"
              
            - name: Install tsx
              run: npm install -g tsx
              
            - name: Update README progress
              run: tsx .github/scripts/update-readme.ts
              
            - name: Commit and push changes
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add README.md
                git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Update progress in README [skip ci]" && git push)
